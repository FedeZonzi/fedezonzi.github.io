name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Update citations from Google Scholar
        id: citations
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 update_citations.py

      - name: Save the new figures
        if: steps.citations.outcome == 'success'
        run: |
          git config user.name "citations-bot"
          git config user.email "citations-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update citations" && git push)

      - name: Prepare the site
        run: |
          mkdir _site
          cp index.html stats.json *.pdf _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed citation update
        if: steps.citations.outcome == 'failure'
        run: |
          echo "The site was published with the previous citation figures."
          exit 1
