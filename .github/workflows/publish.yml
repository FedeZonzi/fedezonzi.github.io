name: Publish site

on:
  push:
    branches: [main]        # publishes every time you change a file
  schedule:
    - cron: "17 6 3 * *"    # on the 3rd of every month at 06:17 UTC: updates citations and checks links
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # full history, to read the date of the last change to the page

      - name: Update citations from Google Scholar
        id: citations
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional
        run: python3 update_citations.py

      - name: Save the new figures
        if: steps.citations.outcome == 'success'
        run: |
          git config user.name "citations-bot"
          git config user.email "citations-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update citations" && git push)

      - name: Prepare the site
        run: |
          mkdir _site
          cp stats.json *.pdf *.png _site/
          UPDATED=$(git log -1 --format=%cd --date=format:'%-d %B %Y' -- index.html)
          sed "s/lastUpdated: \"\"/lastUpdated: \"$UPDATED\"/" index.html > _site/index.html
          printf 'User-agent: *\nAllow: /\nSitemap: https://fedezonzi.github.io/sitemap.xml\n' > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://fedezonzi.github.io/</loc><lastmod>%s</lastmod></url>\n  <url><loc>https://fedezonzi.github.io/Federica_Zonzini_CV.pdf</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(git log -1 --format=%cs -- index.html)" "$(git log -1 --format=%cs -- '*.pdf')" > _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Check links
        id: links
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 check_links.py

      - name: Report problems
        if: steps.citations.outcome == 'failure' || steps.links.outcome == 'failure'
        run: |
          if [ "${{ steps.citations.outcome }}" = "failure" ]; then echo "Citations were not updated: the site shows the previous figures."; fi
          if [ "${{ steps.links.outcome }}" = "failure" ]; then echo "Some links are broken: open the 'Check links' step or the run summary for the list."; fi
          exit 1
